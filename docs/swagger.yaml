definitions:
  dto.SoftwareDTO:
    properties:
      deleted_flg:
        type: boolean
      description:
        type: string
      full_description:
        type: string
      functions:
        type: string
      img_url:
        type: string
      os:
        type: string
      size:
        type: number
      software_id:
        type: integer
      title:
        type: string
      version:
        type: string
    type: object
  dto.SoftwareRequestDTO:
    properties:
      create_dt:
        type: string
      creator_id:
        type: integer
      finish_dt:
        type: string
      moderator_id:
        type: integer
      phone:
        type: string
      request_id:
        type: integer
      status:
        type: string
      update_dt:
        type: string
    type: object
  dto.UsersDTO:
    properties:
      created_requests:
        items:
          $ref: '#/definitions/dto.SoftwareRequestDTO'
        type: array
      login:
        type: string
      moderated_requests:
        items:
          $ref: '#/definitions/dto.SoftwareRequestDTO'
        type: array
      moderator_flg:
        type: boolean
      role:
        type: integer
      user_id:
        type: integer
      uuid:
        type: string
    type: object
  handler.loginReq:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  handler.loginResp:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  handler.registerReq:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  handler.registerResp:
    properties:
      ok:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for Lab1 project
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Lab4 API
  version: "1.0"
paths:
  /api/request/{id}:
    get:
      consumes:
      - application/json
      description: Get details of a specific request
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get request by ID
      tags:
      - Requests
  /api/requests:
    get:
      consumes:
      - application/json
      description: Get list of requests, optionally filtered
      parameters:
      - description: Request status
        in: query
        name: status
        type: string
      - description: Start date YYYY-MM-DD
        in: query
        name: start_date
        type: string
      - description: End date YYYY-MM-DD
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get list of requests
      tags:
      - Requests
  /api/requests/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete user's own request
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete request
      tags:
      - Requests
  /api/requests/{id}/fields:
    put:
      consumes:
      - application/json
      description: Update fields of user's own request
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: fields
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update request fields
      tags:
      - Requests
  /api/requests/{id}/status/{status}:
    put:
      consumes:
      - application/json
      description: Moderator updates request status to completed or rejected
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'Status: completed/rejected'
        in: path
        name: status
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update request status
      tags:
      - Requests
  /api/requests/{request_id}/software/{software_id}/time:
    put:
      consumes:
      - application/json
      description: Update installation time for software in user's request
      parameters:
      - description: Request ID
        in: path
        name: request_id
        required: true
        type: integer
      - description: Software ID
        in: path
        name: software_id
        required: true
        type: integer
      - description: Install time in format 2006-01-02 15:04
        in: body
        name: install_time
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update installation time
      tags:
      - Requests
  /api/requests/{requests_id}/software/{software_id}:
    delete:
      consumes:
      - application/json
      description: Delete installation record for software in user's request
      parameters:
      - description: Request ID
        in: path
        name: requests_id
        required: true
        type: integer
      - description: Software ID
        in: path
        name: software_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete installation record
      tags:
      - Requests
  /api/requests/cart:
    get:
      consumes:
      - application/json
      description: Get the current draft request of the logged-in user, including
        software count
      produces:
      - application/json
      responses:
        "200":
          description: Draft request info
          schema:
            additionalProperties: true
            type: object
        "401":
          description: User UUID missing in context
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Cannot load current user or software count
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user's draft request (cart)
      tags:
      - Requests
  /api/requests/form:
    put:
      consumes:
      - application/json
      description: Convert user's draft request into active request
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Form draft request
      tags:
      - Requests
  /api/software:
    get:
      consumes:
      - application/json
      description: Get list of software with optional filtering by title
      parameters:
      - description: Software title filter
        in: query
        name: app
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.SoftwareDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get list of software
      tags:
      - Software
    post:
      consumes:
      - application/json
      description: Create new software entry
      parameters:
      - description: Software info
        in: body
        name: software
        required: true
        schema:
          $ref: '#/definitions/dto.SoftwareDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SoftwareDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add new software
      tags:
      - Software
  /api/software/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete software by ID
      parameters:
      - description: Software ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Soft delete software
      tags:
      - Software
    get:
      consumes:
      - application/json
      description: Get software by its ID
      parameters:
      - description: Software ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SoftwareDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get software by ID
      tags:
      - Software
    put:
      consumes:
      - application/json
      description: Update existing software by ID
      parameters:
      - description: Software ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated software info
        in: body
        name: software
        required: true
        schema:
          $ref: '#/definitions/dto.SoftwareDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SoftwareDTO'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update software
      tags:
      - Software
  /api/software/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: Upload image for software
      parameters:
      - description: Software ID
        in: path
        name: id
        required: true
        type: integer
      - description: Image file
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload software picture
      tags:
      - Software
  /api/software/to_request/draft/{software_id}:
    post:
      consumes:
      - application/json
      description: Add a software item to the current user's draft request (cart).
        Creates draft if none exists.
      parameters:
      - description: Software ID
        in: path
        name: software_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Added software and updated draft request
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid software ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'Unauthorized: user UUID missing or invalid'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'Forbidden: invalid or missing Authorization header'
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Software not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to create draft request or add software
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add software to user's draft request
      tags:
      - Software
  /api/user/login:
    post:
      consumes:
      - application/json
      description: Login user and get JWT token
      parameters:
      - description: Login info
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handler.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.loginResp'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - User
  /api/user/logout:
    post:
      consumes:
      - application/json
      description: Logout current user, add JWT to blacklist
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - User
  /api/user/profile:
    get:
      consumes:
      - application/json
      description: Get profile info of current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UsersDTO'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update login/password of current user
      parameters:
      - description: User info
        in: body
        name: user
        required: true
        schema:
          properties:
            login:
              type: string
            password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Users
  /api/user/register:
    post:
      consumes:
      - application/json
      description: Create new user account
      parameters:
      - description: User info
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/handler.registerReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.registerResp'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register new user
      tags:
      - User
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
